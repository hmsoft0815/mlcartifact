[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlcartifact"
version = "0.4.0"
description = "Python client for mlcartifact service"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Michael Lechner" }]
license = { text = "MIT" }
dependencies = [
    "httpx[http2]>=0.24.0",
    # Must be >= the protobuf version the stubs in mlcartifact/gen were
    # generated with (see "Protobuf Python Version" in artifact_pb2.py).
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest",
    "black",
    "isort",
]

[tool.setuptools]
packages = ["mlcartifact", "mlcartifact.gen"]

[tool.setuptools.package-data]
"mlcartifact.gen" = ["*.pyi"]
